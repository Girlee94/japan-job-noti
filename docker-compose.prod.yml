# Production override (OCI): docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 프로덕션에서는 외부 DB(Supabase) 사용 → 로컬 DB 비활성화
services:
  db:
    deploy:
      replicas: 0

  api:
    image: ghcr.io/girlee94/ready-japan-api:latest
    restart: always
    depends_on:
      db:
        condition: service_started
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError
        -Xms128m
        -Xmx384m
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      QIITA_ACCESS_TOKEN: ${QIITA_ACCESS_TOKEN}
    deploy:
      resources:
        limits:
          memory: 512M

  batch:
    image: ghcr.io/girlee94/ready-japan-batch:latest
    restart: always
    depends_on:
      db:
        condition: service_started
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError
        -Xms128m
        -Xmx384m
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      QIITA_ACCESS_TOKEN: ${QIITA_ACCESS_TOKEN}
    deploy:
      resources:
        limits:
          memory: 512M
